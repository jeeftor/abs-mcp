# gitleaks configuration for abs-mcp.
#
# The test fixture under test/abs commits a disposable Audiobookshelf root API
# key (a signed JWT) so the Docker fixture is repeatable in local dev and CI.
# It only authenticates against the throwaway fixture instances on
# localhost:13388/13389 and grants no access to any real system. Allowlist it
# so secret scanners do not flag the fixture as a leaked credential.

[extend]
useDefault = true

[allowlist]
description = "Disposable Audiobookshelf fixture API key (test/abs only)"
paths = [
  '''test/abs/\.env\.testing''',
  '''test/abs/\.env\.example''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJrZXlJZCI6ImQ5N2NjODJiLTVkYWUtNDRhOC1iMzM5LWM4N2EzZWNhOTY0YiIsIm5hbWUiOiJSb290QVBJS2V5IiwidHlwZSI6ImFwaSIsImlhdCI6MTc3ODc3NTU2NH0\.zHa8RFgO4JKDzZIdfbNukd1waQtzmdxLc_ihvv6zcuQ''',
]
